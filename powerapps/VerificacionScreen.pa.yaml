Screens:
  VerificacionScreen:
    Properties:
      Fill: |-
        =RGBA(255, 255, 255, 1)
    Children:
      - lblVerTitulo:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =RGBA(31, 78, 121, 1)
            FontWeight: |-
              =FontWeight.Bold
            Height: |-
              =50
            Size: |-
              =20
            Text: |-
              ="Inventario físico · Verificación en sitio"
            Width: |-
              =Parent.Width - 80
            X: |-
              =40
            Y: |-
              =20
      - lblVerInfo:
          Control: Label@2.5.1
          Properties:
            Height: |-
              =30
            Text: |-
              ="Escanee el código QR de la placa con la cámara del celular, o digite la placa si la etiqueta no se puede leer."
            Width: |-
              =Parent.Width - 80
            X: |-
              =40
            Y: |-
              =68
      - lblPlacaCap:
          Control: Label@2.5.1
          Properties:
            FontWeight: |-
              =FontWeight.Semibold
            Height: |-
              =28
            Text: |-
              ="Placa (entrada manual)"
            Width: |-
              =280
            X: |-
              =40
            Y: |-
              =170
      - txtPlacaManual:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: |-
              =""
            HintText: |-
              ="Ej. VYE-0001"
            Width: |-
              =280
            X: |-
              =40
            Y: |-
              =200
      - btnBuscarPlaca:
          Control: Classic/Button@2.2.0
          Properties:
            Height: |-
              =40
            OnSelect: |-
              =Set(varVerif, LookUp(activos, Title = Upper(Trim(txtPlacaManual.Text))));
              If(
                  IsBlank(varVerif),
                  Notify("Placa no registrada en el inventario: " & Upper(Trim(txtPlacaManual.Text)), NotificationType.Error),
                  varVerif.Estado.Value = "Dado de baja",
                  Notify("Atención: el activo " & varVerif.Title & " figura como dado de baja", NotificationType.Warning),
                  !IsBlank(LookUp(colVerificados, Placa = varVerif.Title)),
                  Notify("El activo " & varVerif.Title & " ya fue verificado en esta jornada", NotificationType.Warning)
              )
            Text: |-
              ="Buscar"
            Width: |-
              =130
            X: |-
              =330
            Y: |-
              =200
      - lblActivoInfo:
          Control: Label@2.5.1
          Properties:
            Fill: |-
              =RGBA(243, 242, 241, 1)
            Height: |-
              =110
            PaddingLeft: |-
              =10
            Text: |-
              =If(
                  IsBlank(varVerif),
                  "Ningún activo seleccionado. Escanee o digite una placa.",
                  varVerif.Title & " · " & varVerif.TipoActivo.Value & " " & varVerif.Marca & " " & varVerif.Modelo & Char(10) &
                  "Registrado en: " & varVerif.Sede.Value & " · " & varVerif.Area.Value & Char(10) &
                  "Custodio: " & Coalesce(varVerif.CustodioNombre, "Sin custodio") & Char(10) &
                  "Estado: " & varVerif.Estado.Value & " · Serial: " & varVerif.Serial
              )
            VerticalAlign: |-
              =VerticalAlign.Top
            Width: |-
              =420
            X: |-
              =40
            Y: |-
              =256
      - lblSedeVerCap:
          Control: Label@2.5.1
          Properties:
            FontWeight: |-
              =FontWeight.Semibold
            Height: |-
              =28
            Text: |-
              ="Sede donde se encuentra el equipo"
            Width: |-
              =420
            X: |-
              =40
            Y: |-
              =376
      - ddSedeVerif:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: |-
              =Choices([@VerificacionesInventario].SedeVerificada)
            Items.Value: |-
              =Value
            Width: |-
              =250
            X: |-
              =40
            Y: |-
              =404
      - lblCoincide:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(!IsBlank(varVerif) && varVerif.Sede.Value = ddSedeVerif.Selected.Value, RGBA(16, 124, 16, 1), RGBA(196, 43, 28, 1))
            FontWeight: |-
              =FontWeight.Semibold
            Height: |-
              =40
            Text: |-
              =If(IsBlank(varVerif), "", If(varVerif.Sede.Value = ddSedeVerif.Selected.Value, "✔ La ubicación coincide", "✖ La ubicación NO coincide"))
            Width: |-
              =200
            X: |-
              =300
            Y: |-
              =404
      - chkCustodio:
          Control: Classic/CheckBox@2.1.0
          Properties:
            Height: |-
              =40
            Text: |-
              ="El custodio registrado tiene el equipo"
            Width: |-
              =420
            X: |-
              =40
            Y: |-
              =454
      - lblCondCap:
          Control: Label@2.5.1
          Properties:
            FontWeight: |-
              =FontWeight.Semibold
            Height: |-
              =28
            Text: |-
              ="Condición observada"
            Width: |-
              =200
            X: |-
              =40
            Y: |-
              =500
      - ddCondicion:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: |-
              =Choices([@VerificacionesInventario].CondicionObservada)
            Items.Value: |-
              =Value
            Width: |-
              =200
            X: |-
              =40
            Y: |-
              =528
      - lblNovCap:
          Control: Label@2.5.1
          Properties:
            FontWeight: |-
              =FontWeight.Semibold
            Height: |-
              =28
            Text: |-
              ="Novedad (opcional)"
            Width: |-
              =420
            X: |-
              =40
            Y: |-
              =576
      - txtNovedad:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: |-
              =""
            Height: |-
              =56
            HintText: |-
              ="Ej. pantalla rayada, equipo en otra oficina"
            Mode: |-
              =TextMode.MultiLine
            Width: |-
              =420
            X: |-
              =40
            Y: |-
              =604
      - btnConfirmarVerif:
          Control: Classic/Button@2.2.0
          Properties:
            Height: |-
              =44
            OnSelect: |-
              =If(
                  IsBlank(varVerif),
                  Notify("Primero escanee o digite una placa", NotificationType.Error),
                  With(
                      {coincide: varVerif.Sede.Value = ddSedeVerif.Selected.Value},
                      Patch(
                          VerificacionesInventario,
                          Defaults(VerificacionesInventario),
                          {
                              Title: "INV-" & Text(Today(), "yyyy-mm"),
                              Activo: {Id: varVerif.ID, Value: varVerif.Title},
                              FechaVerificacion: Now(),
                              Verificador: Lower(User().Email),
                              SedeVerificada: {Value: ddSedeVerif.Selected.Value},
                              CoincideUbicacion: coincide,
                              CoincideCustodio: chkCustodio.Value,
                              CondicionObservada: {Value: ddCondicion.Selected.Value},
                              Novedad: txtNovedad.Text
                          }
                      );
                      Collect(colVerificados, {Placa: varVerif.Title, Coincide: coincide, Custodio: chkCustodio.Value, Condicion: ddCondicion.Selected.Value});
                      Notify("Verificado " & varVerif.Title & " (" & CountRows(colVerificados) & " en esta jornada)", NotificationType.Success);
                      Set(varVerif, Blank());
                      Reset(txtPlacaManual);
                      Reset(txtNovedad);
                      Reset(chkCustodio);
                      Reset(ddCondicion)
                  )
              )
            Text: |-
              ="Confirmar verificación"
            Width: |-
              =200
            X: |-
              =40
            Y: |-
              =680
      - btnVolverVerif:
          Control: Classic/Button@2.2.0
          Properties:
            Height: |-
              =44
            OnSelect: |-
              =Navigate(MainScreen1, ScreenTransition.None)
            Text: |-
              ="Volver"
            Width: |-
              =200
            X: |-
              =260
            Y: |-
              =680
      - lblJornadaTitulo:
          Control: Label@2.5.1
          Properties:
            FontWeight: |-
              =FontWeight.Semibold
            Height: |-
              =28
            Text: |-
              ="Resumen de la jornada (" & Text(Today(), "dd/mm/yyyy") & ")"
            Width: |-
              =Parent.Width - 560
            X: |-
              =520
            Y: |-
              =110
      - lblJornada:
          Control: Label@2.5.1
          Properties:
            Height: |-
              =60
            Text: |-
              ="Verificados: " & CountRows(colVerificados) &
              " · Con novedad de ubicación: " & CountRows(Filter(colVerificados, !Coincide)) &
              " · Sin custodio presente: " & CountRows(Filter(colVerificados, !Custodio))
            Width: |-
              =Parent.Width - 560
            X: |-
              =520
            Y: |-
              =140
      - lblVerificados:
          Control: Label@2.5.1
          Properties:
            Height: |-
              =500
            Text: |-
              =Concat(
                  colVerificados,
                  Placa & "  " & If(Coincide, "✔ ubicación", "✖ ubicación") & "  " & If(Custodio, "✔ custodio", "✖ custodio") & "  · " & Condicion,
                  Char(10)
              )
            VerticalAlign: |-
              =VerticalAlign.Top
            Width: |-
              =Parent.Width - 560
            X: |-
              =520
            Y: |-
              =204
